# =============================================================================
# Cloudflare Worker Configuration for raja-1
# Combines Static Assets with Executable Worker Code (D1 & R2 Bindings)
# =============================================================================

name = "raja-1"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "raxo-db"
database_id = "2741f9fc-37f1-4d2c-88f2-04a4336149b3"

# Cloudflare R2 Storage Bucket Binding
[[r2_buckets]]
binding = "RAXO_ASSETS"
bucket_name = "raxo-assets"
